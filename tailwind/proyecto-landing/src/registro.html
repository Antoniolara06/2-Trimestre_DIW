<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - CodeCraft</title>
    <link href="./css/estilos.css" rel="stylesheet">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="bg-black text-white antialiased selection:bg-white selection:text-black min-h-screen flex flex-col justify-between">

    <!-- Navbar Minimalista -->
    <nav class="absolute top-0 w-full z-50 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <a href="index.html" class="flex-shrink-0 flex items-center group">
                    <span
                        class="text-xl font-bold tracking-tight text-white group-hover:text-gray-300 transition-colors">CodeCraft</span>
                </a>

                <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">
                    Volver al inicio
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content (Formulario) -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center">
                <h2 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
                    Inscríbete ahora
                </h2>
                <p class="mt-2 text-sm text-gray-400">
                    Comienza tu viaje hacia la maestría en código.
                </p>
            </div>

            <form class="mt-8 space-y-6" action="#" method="POST">
                <div class="space-y-4 rounded-md shadow-sm">
                    <div>
                        <label for="name" class="sr-only">Nombre completo</label>
                        <input id="name" name="name" type="text" required
                            class="appearance-none relative block w-full px-3 py-3 border border-white/10 placeholder-gray-500 text-white bg-zinc-900/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:z-10 sm:text-sm transition-all duration-200"
                            placeholder="Nombre completo">
                    </div>
                    <div>
                        <label for="email-address" class="sr-only">Correo electrónico</label>
                        <input id="email-address" name="email" type="email" autocomplete="email" required
                            class="appearance-none relative block w-full px-3 py-3 border border-white/10 placeholder-gray-500 text-white bg-zinc-900/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:z-10 sm:text-sm transition-all duration-200"
                            placeholder="Correo electrónico">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Contraseña</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="appearance-none relative block w-full px-3 py-3 border border-white/10 placeholder-gray-500 text-white bg-zinc-900/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:z-10 sm:text-sm transition-all duration-200"
                            placeholder="Contraseña">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-blue-500 focus:ring-blue-500 border-gray-600 rounded bg-zinc-800">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-400">
                            Acepto términos y condiciones
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">
                            ¿Ya tienes cuenta?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-full text-black bg-white hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-white transition-all duration-300 shadow-lg hover:shadow-white/10 hover:-translate-y-0.5">
                        Confirmar Inscripción
                    </button>
                    <!-- "Or" divider optional -->
                    <div class="mt-6 flex items-center justify-center">
                        <div class="border-t border-white/10 w-full"></div>
                        <span class="px-4 text-gray-500 text-xs uppercase tracking-wider bg-black">O</span>
                        <div class="border-t border-white/10 w-full"></div>
                    </div>
                    <button type="button"
                        class="mt-6 w-full flex justify-center items-center py-3 px-4 border border-white/10 rounded-full bg-zinc-900/50 text-white text-sm font-medium hover:bg-zinc-800 transition-colors duration-300">
                        <svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
                        </svg>
                        Continuar con Google
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="border-t border-white/10 bg-black py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-center">
            <p class="text-gray-600 text-sm">
                &copy; 2024 CodeCraft. Todos los derechos reservados.
            </p>
        </div>
    </footer>

</body>

</html>
