<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center p-4 mt-10">
    <div class="bg-gray-950 border border-gray-700 rounded-2xl p-8 shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-white mb-8">Registrate</h1>
        <form action="" class="flex flex-col">
            <label for="text" class="text-white">Name</label>
            <input type="text" id="text" name="text" class="rounded p-2 m-2 border bg-gray-950 border-gray-700" placeholder="Introduce tu nombre">
            <label for="email" class="text-white">Email</label>
            <input type="email" id="email" name="email" class="rounded p-2 m-2 border bg-gray-950 border-gray-700" placeholder="Introduce tu email">
            <label for="password" class="text-white">Password</label>
            <input type="password" id="password" name="password" class="rounded p-2 m-2 border bg-gray-950 border-gray-700" placeholder="Introduce tu contraseña">ç
            <div>
                <input type="checkbox" id="terms" class="w-4 h-4 rounded border-gray-600"/>
                <label for="terms" class="ml-2 text-sm text-gray-300">
                    I agree with terms and conditions
                </label>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4">Submit</button>
        </form>
    </div>
</body>
</html>
